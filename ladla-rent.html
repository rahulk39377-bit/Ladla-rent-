<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ladla Rent 24x7</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --saffron:   #FF6B00;
      --saffron-light: #FF8C38;
      --deep:      #1A1A2E;
      --card-bg:   #FFFFFF;
      --page-bg:   #F6F7FB;
      --text:      #1A1A2E;
      --muted:     #6B7280;
      --green:     #16A34A;
      --green-dk:  #15803D;
      --border:    #E5E7EB;
      --shadow:    0 4px 20px rgba(0,0,0,0.08);
      --radius:    14px;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--deep);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .logo {
      font-family: 'Baloo 2', cursive;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--saffron); }
    .badge {
      background: var(--saffron);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-left: 10px;
      vertical-align: middle;
      letter-spacing: 0.5px;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, var(--deep) 0%, #16213E 100%);
      color: #fff;
      text-align: center;
      padding: 60px 20px 50px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: var(--saffron);
      opacity: 0.08;
      border-radius: 50%;
      top: -100px; right: -100px;
    }
    .hero h1 {
      font-family: 'Baloo 2', cursive;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .hero h1 em { color: var(--saffron); font-style: normal; }
    .hero p {
      font-size: 1.05rem;
      color: #CBD5E1;
      max-width: 500px;
      margin: 0 auto 28px;
    }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat .num {
      font-family: 'Baloo 2', cursive;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--saffron);
    }
    .stat .lbl { font-size: 0.75rem; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }

    /* ── FILTER BAR ── */
    .filter-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: 0.85rem; color: var(--muted); margin-right: 4px; font-weight: 500; }
    .filter-btn {
      background: var(--page-bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 7px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: 'Noto Sans', sans-serif;
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--saffron); color: var(--saffron); }
    .filter-btn.active {
      background: var(--saffron);
      border-color: var(--saffron);
      color: #fff;
    }

    /* ── MAIN GRID ── */
    main {
      max-width: 1100px;
      margin: 36px auto;
      padding: 0 20px;
    }
    .section-title {
      font-family: 'Baloo 2', cursive;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--deep);
    }
    .section-title span { color: var(--saffron); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    /* ── VEHICLE CARD ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .card-icon {
      background: linear-gradient(135deg, #FFF3E8, #FFE8CC);
      padding: 28px 0;
      text-align: center;
      font-size: 3.2rem;
      position: relative;
    }
    .card-type-tag {
      position: absolute;
      top: 12px;
      left: 14px;
      background: var(--saffron);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .driver-tag {
      position: absolute;
      top: 12px;
      right: 14px;
      background: var(--green);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .card-body { padding: 18px 20px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .card-name {
      font-family: 'Baloo 2', cursive;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .card-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
    .card-owner { font-size: 0.82rem; color: var(--muted); }
    .card-owner strong { color: var(--text); }

    .card-rate {
      margin-top: 10px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .rate-num {
      font-family: 'Baloo 2', cursive;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--saffron);
    }
    .rate-unit { font-size: 0.8rem; color: var(--muted); }

    .card-footer { padding: 0 20px 18px; }
    .btn-book {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: 'Noto Sans', sans-serif;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.18s, transform 0.1s;
    }
    .btn-book:hover { background: var(--green-dk); transform: scale(1.02); }
    .btn-book:active { transform: scale(0.98); }

    /* ── MODAL ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      position: relative;
      animation: popIn 0.22s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 18px;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
    }
    .modal h2 {
      font-family: 'Baloo 2', cursive;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .modal-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 22px; }
    .modal label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text); }
    .modal input, .modal select {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-family: 'Noto Sans', sans-serif;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal input:focus, .modal select:focus { border-color: var(--saffron); }
    .modal-summary {
      background: #F6F7FB;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 0.88rem;
    }
    .modal-summary .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .modal-summary .row:last-child { margin-bottom: 0; font-weight: 700; font-size: 0.95rem; }
    .btn-confirm {
      width: 100%;
      background: var(--saffron);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-family: 'Noto Sans', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s;
    }
    .btn-confirm:hover { background: var(--saffron-light); }

    /* ── SUCCESS ── */
    .success-box {
      text-align: center;
      padding: 10px 0;
    }
    .success-icon { font-size: 3.5rem; margin-bottom: 10px; }
    .success-box h2 { font-family: 'Baloo 2', cursive; font-size: 1.5rem; margin-bottom: 8px; }
    .success-box p { color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .driver-info {
      background: #F0FDF4;
      border: 1.5px solid #BBF7D0;
      border-radius: 10px;
      padding: 14px;
      margin: 18px 0;
      font-size: 0.88rem;
      color: var(--green);
      font-weight: 600;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    footer strong { color: var(--saffron); }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      grid-column: 1/-1;
    }
    .empty .emoji { font-size: 3rem; margin-bottom: 12px; }

    @media (max-width: 480px) {
      .hero { padding: 40px 16px 36px; }
      .filter-bar { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Ladla <span>Rent</span> <span class="badge">24×7</span></div>
  <div style="font-size:0.8rem;color:#94A3B8;">📍 Har jagah available</div>
</header>

<!-- HERO -->
<div class="hero">
  <h1>Apna <em>Safar</em>, Apni <em>Marzi</em></h1>
  <p>Bike, Car, Bus ya Truck — sab kuch milega driver ke saath, 24 ghante, 7 din.</p>
  <div class="hero-stats">
    <div class="stat"><div class="num">4</div><div class="lbl">Vehicle Types</div></div>
    <div class="stat"><div class="num">24×7</div><div class="lbl">Available</div></div>
    <div class="stat"><div class="num">₹50</div><div class="lbl">Se Shuru</div></div>
    <div class="stat"><div class="num">100%</div><div class="lbl">Driver Saath</div></div>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <span class="filter-label">Filter:</span>
  <button class="filter-btn active" onclick="filterVehicles('all', this)">Sab</button>
  <button class="filter-btn" onclick="filterVehicles('Bike', this)">🏍️ Bike</button>
  <button class="filter-btn" onclick="filterVehicles('Car', this)">🚗 Car</button>
  <button class="filter-btn" onclick="filterVehicles('Bus', this)">🚌 Bus</button>
  <button class="filter-btn" onclick="filterVehicles('Truck', this)">🚛 Truck</button>
</div>

<!-- MAIN -->
<main>
  <div class="section-title">Available Vehicles <span id="count-label"></span></div>
  <div class="grid" id="vehicle-grid"></div>
</main>

<footer>
  &copy; 2025 <strong>Ladla Rent 24×7</strong> — Developed with ❤️ for you
</footer>

<!-- BOOKING MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  // ── DATA ──
  const vehicles = [
    { id: 1, type: 'Bike',  emoji: '🏍️', name: 'Ladla Bike Ride',    ratePerHour: 50,  desc: 'Chhoti doori ke liye perfect. Fuel efficient aur fast.',         driver: 'Ramesh Bhai' },
    { id: 2, type: 'Car',   emoji: '🚗', name: 'Ladla Family Car',   ratePerHour: 100, desc: 'Family trips ke liye comfortable AC car with driver.',            driver: 'Suresh Kumar' },
    { id: 3, type: 'Bus',   emoji: '🚌', name: 'Ladla Group Bus',    ratePerHour: 150, desc: 'Group travel ke liye best — 20 se 40 log baith sakte hain.',      driver: 'Dinesh Yadav' },
    { id: 4, type: 'Truck', emoji: '🚛', name: 'Ladla Cargo Truck',  ratePerHour: 200, desc: 'Shifting, events ya heavy cargo ke liye reliable truck.',         driver: 'Vijay Patil'  },
  ];

  let currentVehicle = null;
  let activeFilter = 'all';

  // ── RENDER ──
  function renderVehicles(filter) {
    const grid = document.getElementById('vehicle-grid');
    const list = filter === 'all' ? vehicles : vehicles.filter(v => v.type === filter);
    document.getElementById('count-label').textContent = `(${list.length})`;

    if (list.length === 0) {
      grid.innerHTML = `<div class="empty"><div class="emoji">🔍</div><p>Is category mein koi vehicle nahi mila.</p></div>`;
      return;
    }

    grid.innerHTML = list.map(v => `
      <div class="card">
        <div class="card-icon">
          <span class="card-type-tag">${v.type}</span>
          <span>${v.emoji}</span>
          <span class="driver-tag">👨‍✈️ Driver</span>
        </div>
        <div class="card-body">
          <div class="card-name">${v.name}</div>
          <div class="card-desc">${v.desc}</div>
          <div class="card-owner">Owner: <strong>Ladla Rent 24×7</strong></div>
          <div class="card-rate">
            <span class="rate-num">₹${v.ratePerHour}</span>
            <span class="rate-unit">/ ghante</span>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn-book" onclick="openBooking(${v.id})">🚀 Abhi Book Karein</button>
        </div>
      </div>
    `).join('');
  }

  // ── FILTER ──
  function filterVehicles(type, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = type;
    renderVehicles(type);
  }

  // ── BOOKING MODAL ──
  function openBooking(id) {
    currentVehicle = vehicles.find(v => v.id === id);
    document.getElementById('modal-content').innerHTML = bookingForm();
    document.getElementById('overlay').classList.add('open');
    document.getElementById('hours').addEventListener('input', updateSummary);
  }

  function bookingForm() {
    return `
      <h2>🚀 Booking Karein</h2>
      <p class="modal-sub">${currentVehicle.emoji} ${currentVehicle.name} — ₹${currentVehicle.ratePerHour}/ghante</p>
      
      <label>Aapka Naam</label>
      <input type="text" id="cust-name" placeholder="Jaise: Ravi Sharma"/>
      
      <label>Mobile Number</label>
      <input type="tel" id="cust-phone" placeholder="10-digit mobile number"/>
      
      <label>Kitne Ghante chahiye?</label>
      <input type="number" id="hours" min="1" max="24" value="1" placeholder="Ghante"/>

      <div class="modal-summary" id="summary">
        <div class="row"><span>Vehicle</span><span>${currentVehicle.emoji} ${currentVehicle.type}</span></div>
        <div class="row"><span>Driver</span><span>👨‍✈️ ${currentVehicle.driver}</span></div>
        <div class="row"><span>Rate</span><span>₹${currentVehicle.ratePerHour}/hr</span></div>
        <div class="row"><span><b>Kul Kiraya (1 hr)</b></span><span id="total-price"><b>₹${currentVehicle.ratePerHour}</b></span></div>
      </div>

      <button class="btn-confirm" onclick="confirmBooking()">✅ Booking Confirm Karein</button>
    `;
  }

  function updateSummary() {
    const hrs = parseInt(document.getElementById('hours').value) || 1;
    const total = hrs * currentVehicle.ratePerHour;
    const priceEl = document.getElementById('total-price');
    const summaryEl = document.querySelector('.modal-summary .row:last-child span:first-child');
    if (priceEl) priceEl.innerHTML = `<b>₹${total}</b>`;
    if (summaryEl) summaryEl.innerHTML = `<b>Kul Kiraya (${hrs} hr)</b>`;
  }

  function confirmBooking() {
    const name  = document.getElementById('cust-name')?.value.trim();
    const phone = document.getElementById('cust-phone')?.value.trim();
    const hrs   = parseInt(document.getElementById('hours')?.value) || 1;

    if (!name)            { alert('Kripya apna naam darj karein!'); return; }
    if (!/^\d{10}$/.test(phone)) { alert('Kripya sahi 10-digit mobile number darj karein!'); return; }
    if (hrs < 1 || hrs > 24)     { alert('Ghante 1 se 24 ke beech hone chahiye!'); return; }

    const total = hrs * currentVehicle.ratePerHour;
    const bookingId = 'LR' + Date.now().toString().slice(-6);

    document.getElementById('modal-content').innerHTML = `
      <div class="success-box">
        <div class="success-icon">🎉</div>
        <h2>Booking Ho Gayi!</h2>
        <p>Aapki booking confirm ho gayi hai. Driver jaldi aapke paas pahunchega.</p>
        <div class="driver-info">
          👨‍✈️ Driver: ${currentVehicle.driver}<br/>
          📞 Booking ID: <strong>${bookingId}</strong>
        </div>
        <div class="modal-summary">
          <div class="row"><span>Naam</span><span>${name}</span></div>
          <div class="row"><span>Mobile</span><span>${phone}</span></div>
          <div class="row"><span>Vehicle</span><span>${currentVehicle.emoji} ${currentVehicle.type}</span></div>
          <div class="row"><span>Samay</span><span>${hrs} Ghante</span></div>
          <div class="row"><span><b>Total</b></span><span><b>₹${total}</b></span></div>
        </div>
        <button class="btn-confirm" onclick="closeModalDirect()">👍 Theek Hai, Dhanyawad!</button>
      </div>
    `;
  }

  function closeModal(e) {
    if (e.target === document.getElementById('overlay')) closeModalDirect();
  }

  function closeModalDirect() {
    document.getElementById('overlay').classList.remove('open');
  }

  // ── INIT ──
  renderVehicles('all');
</script>
</body>
</html>
